<!doctype html>
<html lang="id" data-app="kasir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Toko Bangunan</title>
<meta name="description" content="Nota jual, pembayaran bon, dan stok toko bangunan. Tersambung ke aplikasi Gudang dan laporan di Google Spreadsheet.">
<meta name="theme-color" content="#F2B300">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="stylesheet" href="huruf.css">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasir Toko">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Tata letak: satu kolom (maks 760px), bilah atas seperti papan nama toko (kuning = kasir, biru baja = gudang),
   navigasi bawah dengan tombol utama di tengah, formulir nota bergaris seperti buku nota kontan */
:root{
  --bg:#E7E8E3; --surface:#FFFFFF; --surface-2:#F3F4F0; --ink:#1D2733; --muted:#5B6570;
  --line:#D2D5CE; --rule:#D3DCEA;
  --accent:#F2B300; --accent-ink:#1D2733; --bar:#F2B300; --bar-ink:#1D2733; --chart:#D29600;
  --red:#B5322A; --red-bg:#FBE7E4; --green:#2C7649; --green-bg:#E1F0E6; --amber:#7E5300; --amber-bg:#FFF1C4; --blue:#2C5797;
  --scrim:rgba(20,26,33,.46); --shadow:0 1px 2px rgba(29,39,51,.07),0 8px 24px rgba(29,39,51,.09);
  --f-display:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,"Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow Semi Condensed","Barlow","Roboto","Segoe UI",system-ui,sans-serif;
  --nav-h:64px;
}
/* Aplikasi gudang: bilah atas biru baja supaya beda dari kasir */
:root[data-app="gudang"]{--bar:#24445E; --bar-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181D; --surface:#1D232A; --surface-2:#252C34; --ink:#E6E9EC; --muted:#9BA5AF;
  --line:#333B44; --rule:#2A3648;
  --accent:#F4BC1C; --accent-ink:#14181D; --bar:#1D232A; --bar-ink:#F4BC1C; --chart:#F4BC1C;
  --red:#F2766B; --red-bg:#3A2422; --green:#62C48E; --green-bg:#1C3326; --amber:#F4BC1C; --amber-bg:#3A311A; --blue:#8DB4F0;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181D; --surface:#1D232A; --surface-2:#252C34; --ink:#E6E9EC; --muted:#9BA5AF;
  --line:#333B44; --rule:#2A3648;
  --accent:#F4BC1C; --accent-ink:#14181D; --bar:#1D232A; --bar-ink:#F4BC1C; --chart:#F4BC1C;
  --red:#F2766B; --red-bg:#3A2422; --green:#62C48E; --green-bg:#1C3326; --amber:#F4BC1C; --amber-bg:#3A311A; --blue:#8DB4F0;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-app="gudang"]:not([data-theme="light"]){--bar:#1A2B3A; --bar-ink:#D6E6F5}}
:root[data-app="gudang"][data-theme="dark"]{--bar:#1A2B3A; --bar-ink:#D6E6F5}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body.ada-lapis{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .kecil{font-size:14px} .merah{color:var(--red)} .hijau{color:var(--green)}
.kolom{display:flex;flex-direction:column;gap:12px}
.deret{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Bilah atas */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid rgba(0,0,0,.08)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bar)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.brand{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;display:flex;flex-direction:column;color:inherit}
.brand-nama{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:13px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ikon-btn{width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:inherit}
.ikon-btn:hover{background:rgba(127,127,127,.14)}
.ikon-btn.kotak{border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* Isi utama */
main{max-width:760px;margin:0 auto;padding-top:16px;padding-bottom:calc(var(--nav-h) + 34px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2.bag{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
h3.sub-h{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.bag-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{color:var(--blue);background:none;border:0;padding:4px 0;font-weight:600;font-size:15px}
.kartu{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kartu-p{padding:14px 16px}
p{margin:0}

/* Tombol */
.btn{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn-utama{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-utama:hover{border-color:var(--accent);filter:brightness(.97)}
.btn-gelap{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn-bahaya{background:var(--red);border-color:var(--red);color:#fff}
.btn-kecil{min-height:36px;padding:0 12px;font-size:14px}
.btn-kecil svg.i{width:18px;height:18px}
.btn-blok{width:100%}
.btn.besar{min-height:52px;font-size:18px;padding:0 22px}
.btn:disabled{opacity:.5;pointer-events:none}

/* Chip & segmen */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 1px 3px;margin:0 -1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted)}
.chip.aktif{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;min-height:38px;border-radius:7px;font-weight:600;color:var(--muted);padding:0 6px}
.seg button.aktif{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* Isian */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.in,.fld>input,.fld>select,.fld>textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.in:focus,.fld>input:focus,.fld>select:focus,.fld>textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{resize:vertical;min-height:64px;line-height:1.35}
.in.besar{font-family:var(--f-display);font-size:24px;font-weight:600;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cari{position:relative}
.cari input{padding-left:40px}
.cari>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.cek{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.cek input{width:20px;height:20px;margin:2px 0 0;flex:none}

/* Daftar */
.daftar{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line);color:inherit;min-height:56px}
.item:first-child{border-top:0}
button.item:hover{background:var(--surface-2)}
.item .utama{flex:1;min-width:0}
.j{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .kanan{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.nilai{font-weight:700;font-variant-numeric:tabular-nums}
.item .ik{width:38px;height:38px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.no-kecil{font-family:var(--f-display);font-weight:600;color:var(--red);letter-spacing:.03em}
.grup-tgl{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--muted);padding:4px 4px 6px}
.kosong{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.kosong b{color:var(--ink);font-size:17px}
.lagi{margin:10px auto 0;display:flex}

.pil{display:inline-flex;align-items:center;min-height:22px;padding:1px 8px;border-radius:5px;font-size:12px;font-weight:700;white-space:nowrap}
.pil-lunas{background:var(--green-bg);color:var(--green)}
.pil-bon{background:var(--amber-bg);color:var(--amber)}
.pil-batal{background:var(--red-bg);color:var(--red);text-decoration:line-through}
.pil-telat{background:var(--red);color:#fff}
.pil-beli{background:var(--surface-2);color:var(--blue);border:1px solid var(--line)}
.coret .j,.coret .nilai{text-decoration:line-through;opacity:.6}

/* Beranda */
.ringkas{padding:16px;display:grid;gap:12px}
.angka-besar{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.statistik{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.statistik b{display:block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statistik span{font-size:12.5px;color:var(--muted)}
.aksi-besar{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.aksi-besar button{white-space:normal;min-width:0;min-height:72px;border-radius:12px;font-family:var(--f-display);font-size:22px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:10px 16px;text-align:left;line-height:1.1;gap:3px}
.aksi-besar small{font-family:var(--f-body);font-size:13px;font-weight:500;opacity:.8;line-height:1.25}
.draf{display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:left;width:100%;border-color:var(--accent);background:var(--amber-bg);color:var(--ink)}
.peringatan .item .ik{background:var(--red-bg);color:var(--red)}
.sambut{display:flex;flex-direction:column;gap:12px}
.langkah{margin:0;padding:0;list-style:none;counter-reset:l;display:flex;flex-direction:column;gap:12px}
.langkah li{counter-increment:l;display:grid;grid-template-columns:30px 1fr;gap:4px 10px;align-items:start}
.langkah li::before{content:counter(l);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);font-size:17px;grid-row:span 2}
.langkah li>div:first-of-type{display:flex;flex-direction:column}
.langkah li>div span{font-size:14px;color:var(--muted)}
.langkah li>.deret,.langkah li>button{grid-column:2;justify-self:start}

/* Navigasi bawah */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--muted);font-weight:600;position:relative}
.nav button.aktif{color:var(--ink)}
.nav button.aktif::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .fab .lingkar{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-24px;box-shadow:var(--shadow);border:3px solid var(--surface)}
.nav .fab .lingkar svg{width:28px;height:28px;stroke-width:2.4}
.nav .fab{color:var(--ink);white-space:nowrap}

/* Lapisan layar penuh */
.lapis{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.lapis.masuk{transform:none}
.lapis-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.lapis-head-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));min-height:58px}
.lapis-head h1{flex:1;min-width:0;font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lapis-isi{flex:1;width:100%;max-width:760px;margin:0 auto;padding-top:14px;padding-bottom:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.lapis-kaki{position:sticky;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lapis-kaki-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.kaki-total{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.kaki-total small{font-size:13px;color:var(--muted);font-weight:600}
.kaki-total b{font-family:var(--f-display);font-size:28px;font-weight:700;white-space:nowrap}

/* Lembar bawah */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
.sheet-wrap.masuk .scrim{opacity:1}
.sheet-wrap.masuk .sheet{transform:none}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sh-head{padding:10px 18px 4px;display:flex;flex-direction:column;gap:4px}
.sh-head h3{font-family:var(--f-display);font-size:23px;font-weight:600;margin:0;line-height:1.15}
.sh-body{padding:8px 18px 14px;display:flex;flex-direction:column;gap:12px}
.sh-foot{position:sticky;bottom:0;background:var(--surface);padding:10px 18px 14px;display:flex;gap:10px;border-top:1px solid var(--line);margin-top:auto}
.sh-foot .btn{flex:1}
.sh-foot.tegak{flex-direction:column}
.menu{display:flex;flex-direction:column;padding:6px 8px 12px}
.menu button{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border:0;background:none;border-radius:10px;text-align:left;font-weight:600;font-size:16px;color:var(--ink)}
.menu button:hover{background:var(--surface-2)}
.menu button.merah{color:var(--red)}
.menu button small{display:block;font-weight:500;color:var(--muted);font-size:13px}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:88%}.sheet::before{display:none}.sh-head{padding-top:18px}}

/* Formulir nota: kertas dari buku nota */
.kertas{background:var(--surface);border:1px solid var(--line);border-radius:3px 3px 12px 12px;position:relative;box-shadow:var(--shadow)}
.kertas::before{content:"";position:absolute;left:0;right:0;top:-1px;height:7px;background:radial-gradient(circle at 7px 0,var(--bg) 3.6px,transparent 4.2px) 0 0/14px 7px repeat-x}
.kertas-kepala{padding:18px 16px 14px;display:grid;gap:10px;border-bottom:2px solid var(--rule)}
.kepala-no{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.no-nota input{color:var(--red);font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.04em;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0;min-height:44px;background:transparent;width:100%}
.no-nota input:focus{outline:none;border-bottom:2px solid var(--accent)}
.kertas-cari{padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-bottom:1px solid var(--rule)}
.cari-deret{display:flex;gap:8px}
.cari-deret .cari{flex:1;min-width:0}
.hasil-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.hasil{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;min-height:52px}
.hasil:first-child{border-top:0}
.hasil:hover,.hasil.fokus{background:var(--amber-bg)}
.hasil .h-n{display:flex;flex-direction:column;min-width:0}
.hasil .h-n b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.hasil small{font-size:13px;color:var(--muted)}
.hasil .h-k{display:flex;flex-direction:column;align-items:flex-end;flex:none;text-align:right}
.hasil-tambah{justify-content:flex-start;color:var(--blue);font-weight:600}
.hasil-tambah small{display:block;font-weight:500}
.kolom-judul{display:flex;justify-content:space-between;padding:8px 16px 4px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.baris{padding:10px 16px 12px;border-bottom:1px solid var(--rule);display:grid;gap:7px}
.baris.baru{animation:kilat 1s ease}
@keyframes kilat{from{background:var(--amber-bg)}to{background:transparent}}
.b-atas{display:flex;align-items:flex-start;gap:8px}
.b-nama{flex:1;min-width:0;font-weight:600;line-height:1.25;padding-top:4px}
.b-atas .in-nama{flex:1;min-width:0;min-height:38px;font-weight:600}
.b-jml{font-weight:700;font-variant-numeric:tabular-nums;padding-top:4px;white-space:nowrap}
.x{width:34px;height:34px;flex:none;border:0;border-radius:8px;background:none;color:var(--muted);font-size:22px;line-height:1;display:grid;place-items:center}
.x:hover{background:var(--surface-2);color:var(--red)}
.b-isi{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex:none}
.qty button{width:40px;height:42px;border:0;background:var(--surface-2);font-size:21px;font-weight:600;color:var(--ink)}

const pad = n => String(n).padStart(2, '0');
function ribu(n) { n = Math.round(+n || 0); const s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (n < 0 ? '-' : '') + s; }
const rp = n => 'Rp ' + ribu(n);
function angka(q) { q = +q || 0; const neg = q < 0; q = Math.abs(Math.round(q * 1000) / 1000); let [a, b] = q.toString().split('.'); a = a.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '-' : '') + (b ? a + ',' + b : a); }
function singkat(v) { v = +v || 0; const a = Math.abs(v); const f = (x, s) => (Math.round(x * 10) / 10).toString().replace('.', ',') + ' ' + s; if (a >= 1e9) return f(v / 1e9, 'M'); if (a >= 1e6) return f(v / 1e6, 'jt'); if (a >= 1e3) return f(v / 1e3, 'rb'); return String(Math.round(v)); }

function tambahHari(t, n) { const d = new Date(t + 'T00:00:00'); d.setDate(d.getDate() + n); return fmtTgl(d); }
function tglPanjang(t) { if (!t) return ''; const [y, m, d] = t.split('-'); return (+d) + ' ' + BLN[+m - 1] + ' ' + y; }
function tglPendek(t) { if (!t) return ''; const [y, m, d] = t.split('-'); return (+d) + ' ' + BLN3[+m - 1] + (y !== hariIni().slice(0, 4) ? ' ' + y : ''); }
function tglHari(t) { const d = new Date(t + 'T00:00:00'); return HARI[d.getDay()] + ', ' + tglPendek(t); }

const jamKini = () => jamDari(Date.now());
function terbilang(n) {
  n = Math.floor(Math.abs(+n || 0)); const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const t = x => {
    if (x < 12) return s[x]; if (x < 20) return t(x - 10) + ' belas'; if (x < 100) return t(Math.floor(x / 10)) + ' puluh' + (x % 10 ? ' ' + t(x % 10) : '');
    if (x < 200) return 'seratus' + (x > 100 ? ' ' + t(x - 100) : ''); if (x < 1000) return t(Math.floor(x / 100)) + ' ratus' + (x % 100 ? ' ' + t(x % 100) : '');
    if (x < 2000) return 'seribu' + (x > 1000 ? ' ' + t(x - 1000) : ''); if (x < 1e6) return t(Math.floor(x / 1000)) + ' ribu' + (x % 1000 ? ' ' + t(x % 1000) : '');
    if (x < 1e9) return t(Math.floor(x / 1e6)) + ' juta' + (x % 1e6 ? ' ' + t(x % 1e6) : ''); if (x < 1e12) return t(Math.floor(x / 1e9)) + ' miliar' + (x % 1e9 ? ' ' + t(x % 1e9) : '');
    return t(Math.floor(x / 1e12)) + ' triliun' + (x % 1e12 ? ' ' + t(x % 1e12) : '');
  };
  const h = n === 0 ? 'nol' : t(n); return h.charAt(0).toUpperCase() + h.slice(1);
}

function bukaLink(url) { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }

/* ---------- penyimpanan di HP ---------- */
let idb = null;
function bukaIDB() { return new Promise(res => { if (!('indexedDB' in window)) return res(null); try { const r = indexedDB.open('toko-bangunan-tersambung', 1); r.onupgradeneeded = () => { r.result.createObjectStore('kv'); }; r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null); } catch (e) { res(null); } }); }
function kvGet(k) { return new Promise(res => { if (!idb) return res(undefined); try { const q = idb.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(undefined); } }); }

const LS = { get(k) { try { return JSON.parse(localStorage.getItem(PRE + k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(PRE + k, JSON.stringify(v)); } catch (e) { } }, del(k) { try { localStorage.removeItem(PRE + k); } catch (e) { } } };

let CFG = Object.assign({ url: '', kode: '', nama: '', huruf: APP === 'kasir' ? 'A' : 'G', kertas: APP === 'kasir' ? '80' : 'A5', tema: 'auto', demo: false }, LS.get('cfg') || {});
const DATA_AWAL = () => ({ toko: { nama: 'Toko Bangunan', alamat: '', telp: '', kaki: '', pj: 'NJ', pb: 'BM' }, barang: [], pelanggan: [], supplier: [], peran: '', waktu: 0 });

let tSimpan = 0;
function simpan() { clearTimeout(tSimpan); tSimpan = setTimeout(simpanSekarang, 250); }

  clearTimeout(tSimpan);

  if (!isi) { try { isi = JSON.parse(localStorage.getItem(PRE + 'semua') || 'null'); } catch (e) { } }

/* ---------- server (Apps Script) ---------- */
const tersambung = () => !!(CFG.demo || (CFG.url && CFG.kode));
async function api(aksi, isi) {
  const body = Object.assign({ aksi, kode: CFG.demo ? 'demo-' + APP : CFG.kode, nama: CFG.nama || '', perangkat: CFG.huruf }, isi || {});
  if (CFG.demo) { const s = await demoServer(); return cekBalasan(s.panggil(JSON.parse(JSON.stringify(body)))); }
  if (!CFG.url) { const e = new Error('Alamat server belum diisi.'); e.server = true; throw e; }
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 45000);
  let r;
  try { r = await fetch(CFG.url, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal, cache: 'no-store' }); }
  catch (e) { const er = new Error(navigator.onLine === false ? 'Tidak ada internet.' : 'Server tidak bisa dihubungi.'); er.offline = true; throw er; }
  finally { clearTimeout(t); }
  let j;
  try { j = await r.json(); } catch (e) { const er = new Error('Balasan server tidak dikenali. Pastikan alamat berakhiran /exec dan akses penerapan "Siapa saja".'); er.server = true; throw er; }
  return cekBalasan(j);
}
function cekBalasan(j) { if (!j || !j.ok) { const e = new Error((j && j.pesan) || 'Server menolak permintaan.'); e.server = true; e.kodeSalah = !!(j && j.kodeSalah); throw e; } return j; }
let DEMO = null;
async function demoServer() { if (DEMO) return DEMO; if (!window.BUAT_DEMO) await muatSkrip('demo.js'); DEMO = window.BUAT_DEMO(); return DEMO; }

function antre(tipe, data, oid) { const op = { oid: oid || data.id || uid(), tipe, data, t: Date.now() }; ANTRE.push(op); simpanSekarang(); setStatus(); return op; }
let SEDANG = null;
function sinkron() { if (!tersambung()) { setStatus(); return Promise.resolve(); } if (!SEDANG) SEDANG = prosesSinkron().finally(() => { SEDANG = null; }); return SEDANG; }
async function prosesSinkron() {
  STATUS.jalan = true; setStatus();
  try {
    let putaran = 0;
    while (ANTRE.length && putaran < 30) {
      putaran++;
      const bagian = ANTRE.slice(0, 10);
      const r = await api('kirim', { paket: bagian.map(x => ({ oid: x.oid, tipe: x.tipe, data: x.data })) });
      for (const h of r.hasil || []) {
        const i = ANTRE.findIndex(x => x.oid === h.oid); if (i < 0) continue;
        const op = ANTRE.splice(i, 1)[0];
        if (h.ok) { if (window.SETELAH_TERKIRIM) SETELAH_TERKIRIM(op, h); }
        else { GAGAL.unshift(Object.assign({}, op, { pesan: h.pesan, waktu: Date.now() })); toast('Ditolak spreadsheet: ' + h.pesan); }
      }
      if (r.barang) aturBarang(r.barang);
      await simpanSekarang();
    }
    const m = await api('muat');
    DATA.toko = m.toko; aturBarang(m.barang); if (m.pelanggan) DATA.pelanggan = m.pelanggan; if (m.supplier) DATA.supplier = m.supplier;
    DATA.peran = m.peran; DATA.waktu = Date.now();
    STATUS.err = ''; STATUS.offline = false; STATUS.ok = Date.now();
    simpan();
  } catch (e) {
    STATUS.err = e.message; STATUS.offline = !!e.offline;
    if (e.kodeSalah) toast('Kode akses ditolak spreadsheet. Periksa Pengaturan.');
  } finally {
    STATUS.jalan = false; setStatus();
    if (window.SETELAH_SINKRON) SETELAH_SINKRON();
  }
}
function setStatus() {
  const el = $('#status'); if (!el) return;
  let k = '', t = '';
  if (!tersambung()) { k = 'galat'; t = 'Belum tersambung'; }
  else if (STATUS.jalan) { k = 'jalan'; t = ANTRE.length ? 'Mengirim ' + ANTRE.length + '…' : 'Memuat…'; }
  else if (ANTRE.length) { k = STATUS.err ? 'galat' : 'antre'; t = ANTRE.length + ' belum terkirim'; }
  else if (STATUS.err) { k = 'galat'; t = STATUS.offline ? 'Offline' : 'Gagal tersambung'; }
  else if (STATUS.ok) { k = 'ok'; t = (CFG.demo ? 'Mode coba · ' : 'Tersambung · ') + jamDari(STATUS.ok); }
  else t = 'Menyambung…';
  el.className = 'status ' + k; el.innerHTML = '<span class="titik"></span><span class="teks">' + esc(t) + '</span>';
}
function bukaStatus() {
  const r = bukaSheet(`<div class="sh-head"><h3>Sambungan ke spreadsheet</h3></div><div class="sh-body">
    <p>${!tersambung() ? 'Aplikasi belum disambungkan. Isi alamat server dan kode akses di Pengaturan.' : CFG.demo ? 'Mode coba: data contoh hanya tersimpan di perangkat ini.' : STATUS.err ? '<b>Terakhir gagal:</b> ' + esc(STATUS.err) : 'Tersambung. Terakhir diperbarui pukul ' + jamDari(STATUS.ok) + '.'}</p>
    ${ANTRE.length ? `<p><b>${ANTRE.length} data belum terkirim.</b> Data tetap aman di HP ini dan dikirim otomatis begitu ada internet.</p><div class="daftar">${ANTRE.slice(0, 8).map(o => `<div class="item"><div class="utama"><div class="j">${esc(labelOp(o))}</div><div class="s">${jamDari(o.t)}</div></div></div>`).join('')}</div>` : ''}
    ${GAGAL.length ? `<p class="merah"><b>${GAGAL.length} data ditolak spreadsheet.</b></p><div class="daftar">${GAGAL.slice(0, 8).map((o, i) => `<div class="item"><div class="utama"><div class="j">${esc(labelOp(o))}</div><div class="s">${esc(o.pesan)}</div></div><button class="btn btn-kecil" data-gagal="${i}">Hapus</button></div>`).join('')}</div>` : ''}
  </div><div class="sh-foot"><button class="btn" data-act="kembali">Tutup</button>${tersambung() ? `<button class="btn btn-utama" id="st-kirim">${ikon('segar')} Perbarui sekarang</button>` : `<button class="btn btn-utama" id="st-atur">Buka pengaturan</button>`}</div>`);
  const k = $('#st-kirim', r.el); if (k) k.onclick = async () => { await kembali(); toast('Memperbarui…'); await sinkron(); toast(STATUS.err ? 'Gagal: ' + STATUS.err : 'Data terbaru sudah dimuat'); };

  $$('[data-gagal]', r.el).forEach(b => b.onclick = async () => { GAGAL.splice(+b.dataset.gagal, 1); simpanSekarang(); await kembali(); bukaStatus(); });
}

}

/* ---------- lapisan, lembar, dialog ---------- */
const TUMPUK = [], TUNGGU = [];
function dorong(r) { TUMPUK.push(r); history.pushState({ lapis: TUMPUK.length }, ''); }

  r.el.classList.remove('masuk'); const el = r.el; setTimeout(() => el.remove(), 230);

}
function bukaLapis(html, opt) { const el = document.createElement('div'); el.className = 'lapis'; el.innerHTML = html; document.body.appendChild(el); document.body.classList.add('ada-lapis'); const r = Object.assign({ el, jenis: 'lapis' }, opt || {}); dorong(r); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('masuk'))); return r; }

function pilih(judul, pesan, opsi) { return new Promise(res => { let hasil = null; const r = bukaSheet(`<div class="sh-head"><h3>${esc(judul)}</h3></div>${pesan ? `<div class="sh-body"><p>${pesan}</p></div>` : ''}<div class="sh-foot ${opsi.length > 2 ? 'tegak' : ''}">${opsi.map((o, i) => `<button class="btn ${o.kelas || ''}" data-pilih="${i}">${esc(o.label)}</button>`).join('')}</div>`, { onClose: () => res(hasil) }); $$('[data-pilih]', r.el).forEach(b => b.onclick = () => { hasil = opsi[+b.dataset.pilih].k; kembali(); }); }); }
const tanya = (judul, pesan, ok, bahaya) => pilih(judul, pesan, [{ k: null, label: 'Batal' }, { k: true, label: ok || 'Ya', kelas: bahaya ? 'btn-bahaya' : 'btn-utama' }]).then(v => v === true);

  let s = h.map((b, i) => { const st = stokTampil(b); return `<button type="button" class="hasil${i === 0 ? ' fokus' : ''}" data-act="ed-pilih" data-id="${b.id}"><span class="h-n"><b>${esc(b.nama)}</b><small>${esc([b.kode, b.kat].filter(Boolean).join(' · '))}</small></span><span class="h-k"><b class="num">${rp(b.hj)}</b><small class="${st <= 0 ? 'merah' : ''}">stok ${angka(st)} ${esc(b.sat)}</small></span></button>`; }).join('');
  s += `<button type="button" class="hasil hasil-tambah" data-act="ed-bebas">${ikon('plus')}<span>Baris tanpa stok “${esc(q)}”<small>Untuk ongkos, jasa, atau barang yang belum ada di daftar</small></span></button>`;
  box.innerHTML = s; box.hidden = false;
}
function bersihCari() { const i = $('#ed-cari'); if (!i) return; i.value = ''; tampilHasil(''); if (matchMedia('(pointer:fine)').matches) i.focus(); else i.blur(); }
function tambahBaris(b) {
  if (!D) return; let idx = -1;
  if (b.bid) { idx = D.items.findIndex(i => i.bid === b.bid); if (idx > -1) D.items[idx].qty = bulat((+D.items[idx].qty || 0) + 1); }
  if (idx < 0) { D.items.push(b); idx = D.items.length - 1; }
  renderBaris(); ubahDraft(); const el = $(`#ed-baris .baris[data-i="${idx}"]`); if (el) { el.classList.add('baru'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } return idx;
}
function edInput(e) {
  const t = e.target; if (!D) return;
  if (t.id === 'ed-cari') { tampilHasil(t.value); return; }
  const b = t.closest('.baris'); if (b) { const it = D.items[+b.dataset.i]; if (!it) return;
    if (t.classList.contains('in-qty')) it.qty = parseQty(t.value); else if (t.classList.contains('in-harga')) it.harga = parseRp(t.value); else if (t.classList.contains('in-nama')) it.nama = t.value; else if (t.classList.contains('in-sat')) it.sat = t.value;
    setText('.b-jml', ribu(Math.round(it.qty * it.harga)), b); perbaruiInfo(); perbaruiTotal(); ubahDraft(); return; }
  switch (t.id) {
    case 'ed-tgl': if (!t.value) return; D.tgl = t.value; $('#ed-no').value = noBerikut(D.tgl).no; break;
    case 'ed-nama': D.nama = t.value; isiPelanggan(); break; case 'ed-hp': D.hp = t.value; break; case 'ed-alamat': D.alamat = t.value; break;
    case 'ed-diskon': D.diskon = parseRp(t.value); break; case 'ed-ongkir': D.ongkir = parseRp(t.value); break;
    case 'ed-terima': D.terima = parseRp(t.value); D.terimaDiisi = t.value.trim() !== ''; break;
    case 'ed-dp': D.bayar = parseRp(t.value); break; case 'ed-jt': D.jt = t.value; break; case 'ed-ket': D.ket = t.value; break;
    default: return;
  }
  perbaruiTotal(); ubahDraft();
}
function edUbah(e) { const t = e.target; if (t.id === 'ed-tgl' || t.id === 'ed-jt') edInput(e); if (t.classList.contains('in-qty')) { const b = t.closest('.baris'); const it = b && D && D.items[+b.dataset.i]; if (it) t.value = angka(it.qty); } }
function edKey(e) {
  if (e.target.id !== 'ed-cari') return;
  if (e.key === 'Enter') { e.preventDefault(); const f = $('#ed-hasil .hasil.fokus') || $('#ed-hasil .hasil'); if (f) f.click(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const L = $$('#ed-hasil .hasil'); if (!L.length) return; e.preventDefault(); let i = L.findIndex(x => x.classList.contains('fokus')); L.forEach(x => x.classList.remove('fokus')); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + L.length) % L.length; L[i].classList.add('fokus'); }
}
async function simpanNota() {
  const d = D; if (!d) return;
  d.items = d.items.filter(i => String(i.nama || '').trim());
  if (!d.items.length) { toast('Tambahkan minimal satu barang.'); return; }
  if (d.items.some(i => !((+i.qty || 0) > 0))) { toast('Ada barang dengan banyaknya 0.'); return; }
  const tot = totalNota(d);
  let bayar, kembali = 0;
  if (d.metode === 'Tunai') { const terima = d.terimaDiisi && d.terima > 0 ? d.terima : tot; if (terima < tot) { toast('Uang kurang ' + rp(tot - terima) + '. Pilih Bon bila sisanya diutang.'); return; } bayar = tot; kembali = terima - tot; }
  else if (d.metode === 'Bon') { bayar = Math.min(+d.bayar || 0, tot); if (!d.nama.trim()) { toast('Isi nama pelanggan untuk nota bon.'); const i = $('#ed-nama'); if (i) { i.focus(); i.scrollIntoView({ block: 'center' }); } return; } }
  else bayar = tot;
  if (d.ambil === 'Diantar' && !String(d.alamat || '').trim()) { toast('Isi alamat antar.'); const i = $('#ed-alamat'); if (i) i.focus(); return; }
  const nb = noBerikut(d.tgl);
  const items = d.items.map(i => ({ bid: i.bid || null, kode: i.kode || '', nama: i.nama.trim(), sat: (i.sat || '').trim(), qty: bulat(+i.qty), harga: Math.round(+i.harga || 0) }));
  const n = { id: d.id, no: nb.no, tgl: d.tgl, jam: jamKini(), nama: d.nama.trim(), hp: d.hp.trim(), alamat: d.ambil === 'Diantar' ? (d.alamat || '').trim() : '', items, sub: subtotal(d), diskon: Math.round(+d.diskon || 0), ongkir: Math.round(+d.ongkir || 0), total: tot, metode: d.metode, bayar, kembali, jt: bayar < tot ? d.jt : '', ambil: d.ambil, status: d.ambil === 'Sudah dibawa' ? 'Selesai' : 'Menunggu', petugas: '', kasir: CFG.nama, ket: d.ket.trim(), batal: false, lunas: 0, sisa: tot - bayar, dibuat: Date.now(), terkirim: false };
  kenal()[n.id] = n; LOKAL.unshift(n.id); LS.set('seq_' + nb.ymd, nb.seq);
  antre('nota', { id: n.id, no: n.no, tgl: n.tgl, jam: n.jam, nama: n.nama, hp: n.hp, alamat: n.alamat, items, diskon: n.diskon, ongkir: n.ongkir, metode: n.metode, bayar: d.metode === 'Bon' ? bayar : n.bayar, terima: d.metode === 'Tunai' ? tot + kembali : 0, jt: n.jt, ambil: n.ambil, kasir: CFG.nama, ket: n.ket }, n.id);
  hapusDraft(); D = null;
  const r = atas(); const baru = r.el.cloneNode(false); baru.classList.add('masuk'); r.el.replaceWith(baru); r.el = baru; r.onClose = null; r.tipe = 'detail'; r.notaId = n.id; r.segarkan = t => { t.el.innerHTML = detailHTML(cariNota(t.notaId)); }; r.segarkan(r); baru.scrollTop = 0;
  toast('Nota tersimpan.' + (n.status === 'Menunggu' ? ' Dikirim ke gudang.' : '')); sinkron();
}

/* ---------- DETAIL NOTA ---------- */
function bukaDetail(id) {
  const n = cariNota(id); if (!n) { toast('Nota tidak ditemukan di HP ini.'); return; }
  bukaLapis(detailHTML(n), { tipe: 'detail', notaId: id, segarkan: t => { const x = cariNota(t.notaId); if (x) t.el.innerHTML = detailHTML(x); } });
  if (tersambung() && !n.belumTerkirim) api('nota', { id }).then(r => { perbaruiKenal(r.nota); simpan(); segarkanAtas(); }).catch(() => { });
}
function detailHTML(n) {
  let banner = '';
  if (n.belumTerkirim) banner += `<div class="banner"><span class="kecil">${ikon('awan')} Belum terkirim ke spreadsheet. Dikirim otomatis saat internet tersedia.</span></div>`;
  if (n.batal) banner += `<div class="banner banner-merah"><div><b>Nota dibatalkan</b>${n.alasan ? ' · ' + esc(n.alasan) : ''}<div class="kecil">${n.batalTertunda ? 'Pembatalan menunggu terkirim.' : 'Stok sudah dikembalikan.'}</div></div></div>`;
  else {
    if (n.sisa > 0) banner += `<div class="banner ${n.jt && n.jt < hariIni() ? 'banner-merah' : 'banner-kuning'}"><div><b>Sisa bon ${rp(n.sisa)}</b>${n.jt ? `<div class="kecil">Jatuh tempo ${tglPanjang(n.jt)}</div>` : ''}</div><button class="btn btn-kecil btn-gelap" data-act="nt-bayar" data-id="${n.id}">Terima bayar</button></div>`;
    banner += `<div class="banner"><div class="kecil"><b>Gudang:</b> ${n.status === 'Selesai' ? 'barang sudah diambil/diantar' : n.status === 'Disiapkan' ? 'barang sedang disiapkan' : 'menunggu disiapkan'}${n.petugas ? ' · ' + esc(n.petugas) : ''} · ${esc(n.ambil || '')}${n.alamat ? ' ke ' + esc(n.alamat) : ''}</div>${pilGudang(n)}</div>`;
  }
  return `<div class="lapis-head"><div class="lapis-head-in"><button class="ikon-btn" data-act="kembali" aria-label="Kembali">${ikon('kembali')}</button><h1>${esc(n.no)}</h1><button class="ikon-btn" data-act="nt-lain" data-id="${n.id}" aria-label="Pilihan lain">${ikon('titik')}</button></div></div>
  <div class="lapis-isi">${banner}<div class="layar-nota"><div class="pa">${notaA(n, 'nota')}</div></div></div>
  <div class="lapis-kaki"><div class="lapis-kaki-in"><button class="btn" data-act="nt-gambar" data-id="${n.id}">${ikon('bagi')} Bagikan</button><button class="btn" data-act="nt-wa" data-id="${n.id}">${ikon('wa')} WA</button><button class="btn btn-utama" style="flex:1" data-act="nt-cetak" data-id="${n.id}">${ikon('cetak')} Cetak</button></div></div>`;
}
function menuNota(n) {
  const r = bukaSheet(`<div class="sh-head"><h3>${esc(n.no)}</h3></div><div class="menu">
    <button data-mn="sj">${ikon('truk')}<span>Cetak surat jalan<small>Daftar barang tanpa harga untuk sopir</small></span></button>
    <button data-mn="gambar">${ikon('bagi')}<span>Bagikan gambar nota</span></button>
    ${!n.batal && n.sisa > 0 ? `<button data-mn="bayar">${ikon('dompet')}<span>Terima pembayaran bon</span></button>` : ''}
    <button data-mn="salin">${ikon('salin')}<span>Salin jadi nota baru<small>Untuk pesanan yang sama, atau memperbaiki nota yang dibatalkan</small></span></button>
    <button data-mn="segar">${ikon('segar')}<span>Muat ulang dari spreadsheet</span></button>
    ${n.batal ? '' : `<button data-mn="batal" class="merah">${ikon('hapus')}<span>Batalkan nota<small>Stok dikembalikan, nota tetap tercatat dengan tanda batal</small></span></button>`}
  </div>`);
  $$('[data-mn]', r.el).forEach(b => b.onclick = async () => {
    const k = b.dataset.mn; await kembali();
    if (k === 'sj') sheetCetak(n, 'sj'); else if (k === 'gambar') bagikanGambar(n); else if (k === 'bayar') sheetBayar([n], 'Terima pembayaran');
    else if (k === 'salin') salinNota(n); else if (k === 'batal') batalkanNota(n);
    else if (k === 'segar') { try { const x = await api('nota', { id: n.id }); perbaruiKenal(x.nota); simpan(); segarkanAtas(); toast('Nota diperbarui'); } catch (e) { toast(e.message); } }
  });
}
async function salinNota(n) {
  const draf = LS.get('draft');
  if (draf && draf.items && draf.items.length && !await tanya('Ganti nota yang belum disimpan?', 'Ada nota lain yang belum disimpan. Nota itu akan dibuang.', 'Buang dan salin', true)) return;
  const d = draftKosong(); Object.assign(d, { nama: n.nama, hp: n.hp, alamat: n.alamat, ambil: n.ambil || 'Ambil di gudang', ongkir: n.ongkir, ket: n.ket, items: n.items.map(i => { const b = i.bid && BMAP[i.bid]; return { bid: b ? i.bid : null, kode: i.kode, nama: i.nama, sat: i.sat, qty: i.qty, harga: b ? +b.hj : i.harga }; }) });
  bukaEditor(d);
}
function batalkanNota(n) {
  const r = bukaSheet(`<div class="sh-head"><h3>Batalkan nota ${esc(n.no)}?</h3></div><div class="sh-body"><p>Stok barang dikembalikan dan nota tidak dihitung di laporan.${n.status === 'Selesai' ? ' <b>Barang sudah keluar dari gudang</b>, pastikan barang sudah dikembalikan pelanggan.' : ''}</p><label class="fld"><span>Alasan</span><input id="bt-alasan" placeholder="Mis. salah input, pembeli batal"></label></div><div class="sh-foot"><button class="btn" data-act="kembali">Jangan</button><button class="btn btn-bahaya" id="bt-ok">Batalkan nota</button></div>`);
  $('#bt-ok', r.el).onclick = async () => { const alasan = $('#bt-alasan', r.el).value.trim(); if (!alasan) { toast('Tulis alasan pembatalan.'); return; } antre('batal', { notaId: n.id, alasan, oleh: CFG.nama }, n.id + '-batal'); const k = kenal()[n.id]; if (k) k.alasan = alasan; await kembali(); toast('Nota dibatalkan'); sinkron(); };
}

/* ---------- aksi ---------- */
Object.assign(AKSI, {
  'nota-baru': () => mulaiNota(),
  'lanjut-draf': () => { const d = LS.get('draft'); if (d) bukaEditor(d); },
  'buka-nota': el => bukaDetail(el.dataset.id),
  'nl-per': el => { U.nota.per = el.dataset.v; render(); VIEWS.nota.masuk(); },
  'st-kat': el => { U.stok.kat = el.dataset.v; render(); },
  'lihat-barang': el => { const b = BMAP[el.dataset.id]; if (b) kartuStokSheet(b); },
  'bayar-grup': el => { const L = grupBon(el.dataset.k); if (L.length) sheetBayar(L, 'Terima pembayaran dari ' + L[0].nama); },
  'tagih': el => { const L = grupBon(el.dataset.k); if (!L.length) return; const tot = L.reduce((s, n) => s + n.sisa, 0); bukaWA(L[0].hp, `Yth. ${L[0].nama},\n\nBerikut rincian bon di ${DATA.toko.nama || 'toko kami'}:\n${L.map(n => `• ${n.no} (${tglPendek(n.tgl)}) sisa ${rp(n.sisa)}`).join('\n')}\n\n*Total: ${rp(tot)}*\n\nTerima kasih.`); },
  'nt-cetak': el => { const n = cariNota(el.dataset.id); if (n) sheetCetak(n); },
  'nt-gambar': el => { const n = cariNota(el.dataset.id); if (n) bagikanGambar(n); },
  'nt-wa': el => { const n = cariNota(el.dataset.id); if (n) bukaWA(n.hp, teksNota(n)); },
  'nt-lain': el => { const n = cariNota(el.dataset.id); if (n) menuNota(n); },
  'nt-bayar': el => { const n = cariNota(el.dataset.id); if (n) sheetBayar([n], 'Terima pembayaran'); },
  'ed-buang': async () => { if (!D) return; if ((D.items.length || D.nama) && !await tanya('Buang nota ini?', 'Isi nota yang belum disimpan akan hilang.', 'Buang', true)) return; hapusDraft(); D = null; const r = atas(); if (r) r.onClose = null; await kembali(); },
  'ed-pilih': el => { const b = BMAP[el.dataset.id]; if (b) { tambahBaris({ bid: b.id, kode: b.kode, nama: b.nama, sat: b.sat, qty: 1, harga: +b.hj || 0 }); bersihCari(); } },
  'ed-bebas': () => { const q = $('#ed-cari').value.trim(); const i = tambahBaris({ bid: null, nama: q || 'Lain-lain', sat: '', qty: 1, harga: 0 }); bersihCari(); setTimeout(() => { const e = $(`#ed-baris .baris[data-i="${i}"] .in-harga`); if (e) { e.focus(); e.select(); } }, 60); },
  'ed-pindai': () => pindai(kode => { const b = DATA.barang.find(x => x.kode && x.kode.toLowerCase() === kode.toLowerCase()); if (b) { tambahBaris({ bid: b.id, kode: b.kode, nama: b.nama, sat: b.sat, qty: 1, harga: +b.hj || 0 }); toast(b.nama + ' ditambahkan'); } else toast('Kode ' + kode + ' belum ada di daftar barang.'); }),
  'ed-qty': el => { const b = el.closest('.baris'); const it = D && D.items[+b.dataset.i]; if (!it) return; const v = bulat((+it.qty || 0) + (+el.dataset.d)); if (v <= 0) return; it.qty = v; $('.in-qty', b).value = angka(v); setText('.b-jml', ribu(Math.round(it.qty * it.harga)), b); perbaruiInfo(); perbaruiTotal(); ubahDraft(); },
  'ed-hapus': el => { const b = el.closest('.baris'); if (!D) return; D.items.splice(+b.dataset.i, 1); renderBaris(); ubahDraft(); },
  'ed-metode': el => { if (!D) return; D.metode = el.dataset.m; if (D.metode !== 'Bon') D.bayar = 0; renderBayar(); ubahDraft(); },
  'ed-ambil': el => { if (!D) return; D.ambil = el.dataset.v; renderAmbil(); ubahDraft(); },
  'ed-uang': el => { if (!D) return; D.terima = +el.dataset.v; D.terimaDiisi = true; const i = $('#ed-terima'); if (i) i.value = ribu(D.terima); perbaruiTotal(); ubahDraft(); },
  'ed-simpan': () => simpanNota()
});

mulaiInti('beranda');
