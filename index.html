<!doctype html>
<html lang="id" data-app="gudang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gudang Toko Bangunan</title>
<meta name="description" content="Pesanan dari kasir, barang masuk dari supplier, stok, dan hitung stok toko bangunan. Tersambung ke aplikasi Kasir dan laporan di Google Spreadsheet.">
<meta name="theme-color" content="#24445E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gudang Toko">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2")}
/* Tata letak: satu kolom (maks 760px), bilah atas seperti papan nama toko (kuning = kasir, biru baja = gudang),
   navigasi bawah dengan tombol utama di tengah, formulir nota bergaris seperti buku nota kontan */
:root{
  --bg:#E7E8E3; --surface:#FFFFFF; --surface-2:#F3F4F0; --ink:#1D2733; --muted:#5B6570;
  --line:#D2D5CE; --rule:#D3DCEA;
  --accent:#F2B300; --accent-ink:#1D2733; --bar:#F2B300; --bar-ink:#1D2733; --chart:#D29600;
  --red:#B5322A; --red-bg:#FBE7E4; --green:#2C7649; --green-bg:#E1F0E6; --amber:#7E5300; --amber-bg:#FFF1C4; --blue:#2C5797;
  --scrim:rgba(20,26,33,.46); --shadow:0 1px 2px rgba(29,39,51,.07),0 8px 24px rgba(29,39,51,.09);
  --f-display:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,"Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow Semi Condensed","Barlow","Roboto","Segoe UI",system-ui,sans-serif;
  --nav-h:64px;
}
/* Aplikasi gudang: bilah atas biru baja supaya beda dari kasir */
:root[data-app="gudang"]{--bar:#24445E; --bar-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181D; --surface:#1D232A; --surface-2:#252C34; --ink:#E6E9EC; --muted:#9BA5AF;
  --line:#333B44; --rule:#2A3648;
  --accent:#F4BC1C; --accent-ink:#14181D; --bar:#1D232A; --bar-ink:#F4BC1C; --chart:#F4BC1C;
  --red:#F2766B; --red-bg:#3A2422; --green:#62C48E; --green-bg:#1C3326; --amber:#F4BC1C; --amber-bg:#3A311A; --blue:#8DB4F0;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181D; --surface:#1D232A; --surface-2:#252C34; --ink:#E6E9EC; --muted:#9BA5AF;
  --line:#333B44; --rule:#2A3648;
  --accent:#F4BC1C; --accent-ink:#14181D; --bar:#1D232A; --bar-ink:#F4BC1C; --chart:#F4BC1C;
  --red:#F2766B; --red-bg:#3A2422; --green:#62C48E; --green-bg:#1C3326; --amber:#F4BC1C; --amber-bg:#3A311A; --blue:#8DB4F0;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-app="gudang"]:not([data-theme="light"]){--bar:#1A2B3A; --bar-ink:#D6E6F5}}
:root[data-app="gudang"][data-theme="dark"]{--bar:#1A2B3A; --bar-ink:#D6E6F5}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body.ada-lapis{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .kecil{font-size:14px} .merah{color:var(--red)} .hijau{color:var(--green)}
.kolom{display:flex;flex-direction:column;gap:12px}
.deret{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Bilah atas */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid rgba(0,0,0,.08)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bar)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.brand{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;display:flex;flex-direction:column;color:inherit}
.brand-nama{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:13px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ikon-btn{width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:inherit}
.ikon-btn:hover{background:rgba(127,127,127,.14)}
.ikon-btn.kotak{border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* Isi utama */
main{max-width:760px;margin:0 auto;padding-top:16px;padding-bottom:calc(var(--nav-h) + 34px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2.bag{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
h3.sub-h{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.bag-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{color:var(--blue);background:none;border:0;padding:4px 0;font-weight:600;font-size:15px}
.kartu{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kartu-p{padding:14px 16px}
p{margin:0}

/* Tombol */
.btn{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn-utama{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-utama:hover{border-color:var(--accent);filter:brightness(.97)}
.btn-gelap{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn-bahaya{background:var(--red);border-color:var(--red);color:#fff}
.btn-kecil{min-height:36px;padding:0 12px;font-size:14px}
.btn-kecil svg.i{width:18px;height:18px}
.btn-blok{width:100%}
.btn.besar{min-height:52px;font-size:18px;padding:0 22px}
.btn:disabled{opacity:.5;pointer-events:none}

/* Chip & segmen */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 1px 3px;margin:0 -1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted)}
.chip.aktif{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;min-height:38px;border-radius:7px;font-weight:600;color:var(--muted);padding:0 6px}
.seg button.aktif{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* Isian */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.in,.fld>input,.fld>select,.fld>textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.in:focus,.fld>input:focus,.fld>select:focus,.fld>textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{resize:vertical;min-height:64px;line-height:1.35}
.in.besar{font-family:var(--f-display);font-size:24px;font-weight:600;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cari{position:relative}
.cari input{padding-left:40px}
.cari>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.cek{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.cek input{width:20px;height:20px;margin:2px 0 0;flex:none}

/* Daftar */
.daftar{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line);color:inherit;min-height:56px}
.item:first-child{border-top:0}
button.item:hover{background:var(--surface-2)}
.item .utama{flex:1;min-width:0}
.j{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .kanan{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.nilai{font-weight:700;font-variant-numeric:tabular-nums}
.item .ik{width:38px;height:38px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.no-kecil{font-family:var(--f-display);font-weight:600;color:var(--red);letter-spacing:.03em}
.grup-tgl{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--muted);padding:4px 4px 6px}
.kosong{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.kosong b{color:var(--ink);font-size:17px}
.lagi{margin:10px auto 0;display:flex}

.pil{display:inline-flex;align-items:center;min-height:22px;padding:1px 8px;border-radius:5px;font-size:12px;font-weight:700;white-space:nowrap}
.pil-lunas{background:var(--green-bg);color:var(--green)}
.pil-bon{background:var(--amber-bg);color:var(--amber)}
.pil-batal{background:var(--red-bg);color:var(--red);text-decoration:line-through}
.pil-telat{background:var(--red);color:#fff}
.pil-beli{background:var(--surface-2);color:var(--blue);border:1px solid var(--line)}
.coret .j,.coret .nilai{text-decoration:line-through;opacity:.6}

/* Beranda */
.ringkas{padding:16px;display:grid;gap:12px}
.angka-besar{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.statistik{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.statistik b{display:block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statistik span{font-size:12.5px;color:var(--muted)}
.aksi-besar{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.aksi-besar button{white-space:normal;min-width:0;min-height:72px;border-radius:12px;font-family:var(--f-display);font-size:22px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:10px 16px;text-align:left;line-height:1.1;gap:3px}
.aksi-besar small{font-family:var(--f-body);font-size:13px;font-weight:500;opacity:.8;line-height:1.25}
.draf{display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:left;width:100%;border-color:var(--accent);background:var(--amber-bg);color:var(--ink)}
.peringatan .item .ik{background:var(--red-bg);color:var(--red)}
.sambut{display:flex;flex-direction:column;gap:12px}
.langkah{margin:0;padding:0;list-style:none;counter-reset:l;display:flex;flex-direction:column;gap:12px}
.langkah li{counter-increment:l;display:grid;grid-template-columns:30px 1fr;gap:4px 10px;align-items:start}
.langkah li::before{content:counter(l);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);font-size:17px;grid-row:span 2}
.langkah li>div:first-of-type{display:flex;flex-direction:column}
.langkah li>div span{font-size:14px;color:var(--muted)}
.langkah li>.deret,.langkah li>button{grid-column:2;justify-self:start}

/* Navigasi bawah */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--muted);font-weight:600;position:relative}
.nav button.aktif{color:var(--ink)}
.nav button.aktif::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .fab .lingkar{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-24px;box-shadow:var(--shadow);border:3px solid var(--surface)}
.nav .fab .lingkar svg{width:28px;height:28px;stroke-width:2.4}
.nav .fab{color:var(--ink);white-space:nowrap}

/* Lapisan layar penuh */
.lapis{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.lapis.masuk{transform:none}
.lapis-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.lapis-head-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));min-height:58px}
.lapis-head h1{flex:1;min-width:0;font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lapis-isi{flex:1;width:100%;max-width:760px;margin:0 auto;padding-top:14px;padding-bottom:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.lapis-kaki{position:sticky;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lapis-kaki-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.kaki-total{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.kaki-total small{font-size:13px;color:var(--muted);font-weight:600}
.kaki-total b{font-family:var(--f-display);font-size:28px;font-weight:700;white-space:nowrap}

/* Lembar bawah */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
.sheet-wrap.masuk .scrim{opacity:1}
.sheet-wrap.masuk .sheet{transform:none}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sh-head{padding:10px 18px 4px;display:flex;flex-direction:column;gap:4px}
.sh-head h3{font-family:var(--f-display);font-size:23px;font-weight:600;margin:0;line-height:1.15}
.sh-body{padding:8px 18px 14px;display:flex;flex-direction:column;gap:12px}
.sh-foot{position:sticky;bottom:0;background:var(--surface);padding:10px 18px 14px;display:flex;gap:10px;border-top:1px solid var(--line);margin-top:auto}
.sh-foot .btn{flex:1}
.sh-foot.tegak{flex-direction:column}
.menu{display:flex;flex-direction:column;padding:6px 8px 12px}
.menu button{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border:0;background:none;border-radius:10px;text-align:left;font-weight:600;font-size:16px;color:var(--ink)}
.menu button:hover{background:var(--surface-2)}
.menu button.merah{color:var(--red)}
.menu button small{display:block;font-weight:500;color:var(--muted);font-size:13px}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:88%}.sheet::before{display:none}.sh-head{padding-top:18px}}

/* Formulir nota: kertas dari buku nota */
.kertas{background:var(--surface);border:1px solid var(--line);border-radius:3px 3px 12px 12px;position:relative;box-shadow:var(--shadow)}
.kertas::before{content:"";position:absolute;left:0;right:0;top:-1px;height:7px;background:radial-gradient(circle at 7px 0,var(--bg) 3.6px,transparent 4.2px) 0 0/14px 7px repeat-x}
.kertas-kepala{padding:18px 16px 14px;display:grid;gap:10px;border-bottom:2px solid var(--rule)}
.kepala-no{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.no-nota input{color:var(--red);font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.04em;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0;min-height:44px;background:transparent;width:100%}
.no-nota input:focus{outline:none;border-bottom:2px solid var(--accent)}
.kertas-cari{padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-bottom:1px solid var(--rule)}
.cari-deret{display:flex;gap:8px}
.cari-deret .cari{flex:1;min-width:0}
.hasil-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.hasil{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;min-height:52px}
.hasil:first-child{border-top:0}
.hasil:hover,.hasil.fokus{background:var(--amber-bg)}
.hasil .h-n{display:flex;flex-direction:column;min-width:0}
.hasil .h-n b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.hasil small{font-size:13px;color:var(--muted)}
.hasil .h-k{display:flex;flex-direction:column;align-items:flex-end;flex:none;text-align:right}
.hasil-tambah{justify-content:flex-start;color:var(--blue);font-weight:600}
.hasil-tambah small{display:block;font-weight:500}

'use strict';

const APP = document.documentElement.dataset.app;            // 'kasir' | 'gudang'

/* ---------- alat bantu ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
function ribu(n) { n = Math.round(+n || 0); const s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (n < 0 ? '-' : '') + s; }

/* ---------- server (Apps Script) ---------- */
const tersambung = () => !!(CFG.demo || (CFG.url && CFG.kode));
async function api(aksi, isi) {
  const body = Object.assign({ aksi, kode: CFG.demo ? 'demo-' + APP : CFG.kode, nama: CFG.nama || '', perangkat: CFG.huruf }, isi || {});
  if (CFG.demo) { const s = await demoServer(); return cekBalasan(s.panggil(JSON.parse(JSON.stringify(body)))); }
  if (!CFG.url) { const e = new Error('Alamat server belum diisi.'); e.server = true; throw e; }

  let r;
  try { r = await fetch(CFG.url, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal, cache: 'no-store' }); }

function antre(tipe, data, oid) { const op = { oid: oid || data.id || uid(), tipe, data, t: Date.now() }; ANTRE.push(op); simpanSekarang(); setStatus(); return op; }

async function prosesSinkron() {
  STATUS.jalan = true; setStatus();
  try {
    let putaran = 0;
    while (ANTRE.length && putaran < 30) {
      putaran++;
      const bagian = ANTRE.slice(0, 10);
      const r = await api('kirim', { paket: bagian.map(x => ({ oid: x.oid, tipe: x.tipe, data: x.data })) });
      for (const h of r.hasil || []) {
        const i = ANTRE.findIndex(x => x.oid === h.oid); if (i < 0) continue;
        const op = ANTRE.splice(i, 1)[0];
        if (h.ok) { if (window.SETELAH_TERKIRIM) SETELAH_TERKIRIM(op, h); }
        else { GAGAL.unshift(Object.assign({}, op, { pesan: h.pesan, waktu: Date.now() })); toast('Ditolak spreadsheet: ' + h.pesan); }
      }
      if (r.barang) aturBarang(r.barang);
      await simpanSekarang();
    }
    const m = await api('muat');
    DATA.toko = m.toko; aturBarang(m.barang); if (m.pelanggan) DATA.pelanggan = m.pelanggan; if (m.supplier) DATA.supplier = m.supplier;
    DATA.peran = m.peran; DATA.waktu = Date.now();

    simpan();
  } catch (e) {
    STATUS.err = e.message; STATUS.offline = !!e.offline;
    if (e.kodeSalah) toast('Kode akses ditolak spreadsheet. Periksa Pengaturan.');

  const data = { id: m.id, no: nb.no, tgl: m.tgl, jam: jamKini(), supplier: m.supplier.trim(), noSup: m.noSup.trim(), items: m.items.map(i => ({ bid: i.bid, nama: i.nama, sat: i.sat, qty: bulat(+i.qty), harga: Math.round(+i.harga || 0), hjBaru: Math.round(+i.hjBaru || 0) })), ongkir: Math.round(+m.ongkir || 0), metode: m.metode, bayar, jt: bayar < tot ? m.jt : '', petugas: CFG.nama, ket: m.ket.trim(), foto: m.foto.slice() };
  antre('masuk', data, data.id); LS.set('seqm_' + nb.ymd, nb.seq);
  for (const i of data.items) { const b = BMAP[i.bid]; if (b) { b.stok = bulat(b.stok + i.qty); if (i.harga > 0) b.hb = i.harga; if (i.hjBaru > 0) b.hj = i.hjBaru; } }
  if (data.supplier && !DATA.supplier.includes(data.supplier)) DATA.supplier.push(data.supplier);
  LS.del('draftMasuk'); M = null; const r = atas(); if (r) r.onClose = null; simpan();
  await kembali(); toast('Barang masuk ' + data.no + ' tersimpan. Stok bertambah.'); ke('riwayat'); sinkron();
}

/* ---------- RIWAYAT BARANG MASUK ---------- */
VIEWS.riwayat = {
  html() {
    if (!tersambung()) return kartuSambung();
    const tunda = ANTRE.filter(o => o.tipe === 'masuk').map(o => Object.assign({}, o.data, { tertunda: true, total: o.data.items.reduce((a, i) => a + Math.round(i.qty * i.harga), 0) + (o.data.ongkir || 0) }));
    const L = tunda.concat((CACHE.masuk || []).filter(m => !tunda.some(t => t.id === m.id)));
    return `<div class="bag-head"><h2 class="bag">Riwayat barang masuk</h2><button class="btn btn-kecil btn-utama" data-act="masuk-baru">${ikon('plus')} Barang masuk</button></div>
    <p class="muted kecil">30 hari terakhir${U.riw.memuat ? ' · memuat…' : U.riw.err ? ' · data tersimpan di HP' : ''}</p>
    ${L.length ? `<div class="daftar">${L.map(m => `<button class="item" data-act="buka-masuk" data-id="${m.id}"><div class="utama"><div class="j">${esc(m.supplier || 'Supplier')}</div><div class="s"><span class="no-kecil">${esc(m.no)}</span> · ${tglPendek(m.tgl)} · ${m.items.length} barang${m.noSup ? ' · nota ' + esc(m.noSup) : ''}</div></div><div class="kanan"><div class="nilai">${rp(m.total)}</div>${m.tertunda ? '<span class="pil pil-antre">Belum terkirim</span>' : m.statusBayar === 'Lunas' ? '<span class="pil pil-lunas">Lunas</span>' : '<span class="pil pil-bon">Utang</span>'}</div></button>`).join('')}</div>` : `<div class="kartu kosong"><b>Belum ada barang masuk</b><span>Catat barang dari supplier dengan tombol + di bawah.</span></div>`}`;
  },
  async masuk() {
    if (!tersambung()) return; U.riw.memuat = true; if (V === 'riwayat') render();
    try { const r = await api('masuk', { dari: tambahHari(hariIni(), -30) }); CACHE.masuk = r.masuk; U.riw.err = ''; simpan(); } catch (e) { U.riw.err = e.message; }
    U.riw.memuat = false; if (V === 'riwayat') render();
  }
};
function bukaDetailMasuk(id) {
  const op = ANTRE.find(o => o.tipe === 'masuk' && o.data.id === id); const m = op ? Object.assign({}, op.data, { tertunda: true }) : (CACHE.masuk || []).find(x => x.id === id); if (!m) return;
  const tot = m.total || (m.items.reduce((a, i) => a + Math.round(i.qty * i.harga), 0) + (m.ongkir || 0));
  bukaSheet(`<div class="sh-head"><h3>${esc(m.no)}</h3><p class="muted kecil">${esc(m.supplier)} · ${tglPanjang(m.tgl)}${m.noSup ? ' · nota supplier ' + esc(m.noSup) : ''}${m.petugas ? ' · ' + esc(m.petugas) : ''}</p></div><div class="sh-body">
    ${m.tertunda ? '<div class="banner"><span class="kecil">Belum terkirim ke spreadsheet. Dikirim otomatis saat internet tersedia.</span></div>' : ''}
    <div class="tabel-wrap"><table class="tabel"><thead><tr><th>Barang</th><th class="n">Banyaknya</th><th class="n">Harga</th><th class="n">Jumlah</th></tr></thead><tbody>${m.items.map(i => `<tr><td>${esc(i.nama)}</td><td class="n">${angka(i.qty)} ${esc(i.sat || '')}</td><td class="n">${ribu(i.harga)}</td><td class="n">${ribu(Math.round(i.qty * i.harga))}</td></tr>`).join('')}</tbody></table></div>
    <div class="tr tebal"><span>Total</span><b class="num">${rp(tot)}</b></div>
    <p class="kecil">Pembayaran: <b>${esc(m.metode)}</b>${m.metode === 'Tempo' ? ` · dibayar ${rp(m.bayar || 0)}${m.jt ? ' · jatuh tempo ' + tglPendek(m.jt) : ''}` : ''}${m.statusBayar ? ' · ' + esc(m.statusBayar) : ''}</p>
    ${m.ket ? `<p class="kecil"><b>Catatan:</b> ${esc(m.ket)}</p>` : ''}
    ${(m.foto || []).length ? `<div class="deret">${m.foto.map((u, i) => /^data:/.test(u) ? `<img src="${u}" alt="Foto nota ${i + 1}" style="width:86px;height:86px;object-fit:cover;border-radius:8px">` : /^https:/.test(u) ? `<a class="btn btn-kecil" href="${esc(u)}" target="_blank" rel="noopener">${ikon('kamera')} Foto nota ${i + 1}</a>` : `<span class="muted kecil">Foto nota ${i + 1} (mode coba: tidak diunggah)</span>`).join('')}</div>` : ''}
  </div><div class="sh-foot"><button class="btn" data-act="kembali">Tutup</button></div>`);
}

/* ---------- HITUNG STOK ---------- */
function hitungan() { return CACHE.hitung || (CACHE.hitung = {}); }
VIEWS.hitung = {
  html() {
    if (!tersambung()) return kartuSambung();
    const H = hitungan(); const n = Object.keys(H).filter(k => String(H[k]).trim() !== '').length;
    const kats = [...new Set(DATA.barang.filter(b => b.status !== 'Arsip').map(b => b.kat || 'Lainnya'))].sort((a, b) => a.localeCompare(b, 'id'));
    const ch = (v, l) => `<button class="chip${U.hit.kat === v ? ' aktif' : ''}" data-act="hit-kat" data-v="${esc(v)}">${esc(l)}</button>`;
    return `<div class="bag-head"><h2 class="bag">Hitung stok fisik</h2></div>
    <p class="muted kecil">Hitung barang yang ada di gudang lalu isi angkanya. Barang yang sudah dibayar tapi belum diambil pelanggan ikut dihitung. Selisih dicatat sebagai penyesuaian di kartu stok. Isian tersimpan di HP sampai disimpan.</p>
    <div class="cari">${ikon('cari')}<input id="hit-q" class="in" type="search" placeholder="Cari barang" value="${esc(U.hit.q)}" autocomplete="off"></div>
    <div class="chips">${ch('', 'Semua')}${ch('~isi', 'Sudah diisi')}${kats.map(k => ch(k, k)).join('')}</div>
    <div id="hit-isi"></div>
    <div class="kartu kartu-p deret" style="position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));justify-content:space-between;box-shadow:var(--shadow)"><span><b id="hit-n">${n}</b> barang dihitung</span><div class="deret">${n ? '<button class="btn btn-kecil" data-act="hit-kosong">Kosongkan</button>' : ''}<button class="btn btn-utama" data-act="hit-simpan"${n ? '' : ' disabled'}>Simpan hitungan</button></div></div>`;
  },
  lalu() { isiHitung(); }
};
function selisihTeks(b, v) { if (String(v).trim() === '') return ''; const d = bulat(parseQty(v) - fisik(b)); return d === 0 ? '<span class="hijau">Cocok</span>' : `<span class="${d < 0 ? 'merah' : 'hijau'}">Selisih ${d > 0 ? '+' : ''}${angka(d)} ${esc(b.sat)}</span>`; }
function isiHitung() {
  const box = $('#hit-isi'); if (!box) return; const H = hitungan();
  let L = DATA.barang.filter(b => b.status !== 'Arsip');
  if (U.hit.kat === '~isi') L = L.filter(b => H[b.id] !== undefined && String(H[b.id]).trim() !== ''); else if (U.hit.kat) L = L.filter(b => (b.kat || 'Lainnya') === U.hit.kat);
  L = L.filter(b => cariTeks(U.hit.q, b.nama + ' ' + b.kode + ' ' + b.kat)).sort((a, b) => a.nama.localeCompare(b.nama, 'id'));
  box.innerHTML = L.length ? `<div class="daftar">${L.slice(0, 300).map(b => `<div class="opname" data-id="${b.id}"><div><div class="j">${esc(b.nama)}</div><div class="s">Di sistem ${angka(fisik(b))} ${esc(b.sat)}${b.belum ? ' (termasuk ' + angka(b.belum) + ' belum diambil)' : ''}</div></div><input class="in in-fisik" inputmode="decimal" placeholder="Fisik" value="${esc(H[b.id] == null ? '' : H[b.id])}" aria-label="Jumlah fisik ${esc(b.nama)}"><div class="selisih">${selisihTeks(b, H[b.id] == null ? '' : H[b.id])}</div></div>`).join('')}</div>` : '<div class="kosong"><b>Tidak ada barang</b></div>';
}
PADA_INPUT['hit-q'] = t => { U.hit.q = t.value; isiHitung(); };
document.addEventListener('input', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('in-fisik')) return; const row = t.closest('.opname'); const b = BMAP[row.dataset.id]; if (!b) return;
  const H = hitungan(); if (t.value.trim() === '') delete H[b.id]; else H[b.id] = t.value.trim();
  $('.selisih', row).innerHTML = selisihTeks(b, t.value); const n = Object.keys(H).length; setText('#hit-n', n); const tb = $('[data-act="hit-simpan"]'); if (tb) tb.disabled = !n; simpan();
});
async function simpanHitung() {
  const H = hitungan(); const ids = Object.keys(H).filter(id => BMAP[id] && String(H[id]).trim() !== ''); if (!ids.length) return;
  const beda = ids.map(id => ({ b: BMAP[id], d: bulat(parseQty(H[id]) - fisik(BMAP[id])) })).filter(x => x.d !== 0);
  if (!await tanya('Simpan hitungan ' + ids.length + ' barang?', beda.length ? `${beda.length} barang berselisih:<br>${beda.slice(0, 8).map(x => esc(x.b.nama) + ': ' + (x.d > 0 ? '+' : '') + angka(x.d) + ' ' + esc(x.b.sat)).join('<br>')}${beda.length > 8 ? '<br>…' : ''}` : 'Semua barang cocok dengan catatan sistem.', 'Simpan')) return;
  const d = new Date(); const id = uid();
  antre('opname', { id, no: 'OP-' + hariIni().slice(2).replace(/-/g, '') + '-' + pad(d.getHours()) + pad(d.getMinutes()), tgl: hariIni(), petugas: CFG.nama, items: ids.map(i => ({ bid: i, fisik: parseQty(H[i]) })) }, id);
  for (const i of ids) { const b = BMAP[i]; b.stok = bulat(parseQty(H[i]) - (b.belum || 0)); }
  CACHE.hitung = {}; simpan(); toast('Hitungan tersimpan. Stok disesuaikan.'); render(); sinkron();
}

/* ---------- aksi ---------- */
Object.assign(AKSI, {
  'ps-f': el => { U.ps.f = el.dataset.v; render(); },
  'ps-segar': () => { toast('Memuat pesanan…'); ambilPesanan(); },
  'ps-cek': el => { const c = centang(); const m = c[el.dataset.id] || (c[el.dataset.id] = {}); m[el.dataset.k] = !m[el.dataset.k]; el.classList.toggle('ok', !!m[el.dataset.k]); simpan(); },
  'ps-status': el => { const n = cariNota(el.dataset.id); if (n) ubahStatus(n, el.dataset.s); },
  'ps-selesai': async el => {
    const n = cariNota(el.dataset.id); if (!n) return; const c = centang()[n.id] || {}; const belum = n.items.filter((_, k) => !c[k]).length;
    if (!await tanya(n.ambil === 'Diantar' ? 'Barang sudah diantar?' : 'Barang sudah diserahkan?', `${esc(n.no)} untuk ${esc(n.nama || 'pembeli umum')}, ${n.items.length} jenis barang.${belum ? ` <b>${belum} barang belum dicentang.</b>` : ''}`, n.ambil === 'Diantar' ? 'Sudah diantar' : 'Sudah diserahkan')) return;
    ubahStatus(n, 'Selesai'); toast(n.no + ' selesai');
  },
  'ps-cetak': el => { const n = cariNota(el.dataset.id); if (n) sheetCetak(n, 'sj'); },
  'st-kat': el => { U.stok.kat = el.dataset.v; render(); },
  'barang-baru': el => bukaBarang(null, { nama: el.dataset.nama || '' }),
  'buka-barang': el => bukaBarang(el.dataset.id),
  'masuk-baru': () => mulaiMasuk(),
  'buka-masuk': el => bukaDetailMasuk(el.dataset.id),
  'hit-kat': el => { U.hit.kat = el.dataset.v; render(); },
  'hit-kosong': async () => { if (await tanya('Kosongkan semua isian hitungan?', '', 'Kosongkan', true)) { CACHE.hitung = {}; simpan(); render(); } },
  'hit-simpan': () => simpanHitung(),
  'm-buang': async () => { if (!M) return; if (M.items.length && !await tanya('Buang penerimaan ini?', 'Isian yang belum disimpan akan hilang.', 'Buang', true)) return; LS.del('draftMasuk'); M = null; const r = atas(); if (r) r.onClose = null; await kembali(); },
  'm-pilih': el => { const b = BMAP[el.dataset.id]; if (b && M) mTambah(b); },
  'm-baru': () => { const q = $('#m-cari').value.trim(); bukaBarang(null, { nama: q, lalu: b => { if (M && b) mTambah(b); } }); },
  'm-pindai': () => pindai(kode => { const b = DATA.barang.find(x => x.kode && x.kode.toLowerCase() === kode.toLowerCase()); if (b) { mTambah(b); toast(b.nama + ' ditambahkan'); } else bukaBarang(null, { kode, lalu: x => { if (M && x) mTambah(x); } }); }),
  'm-qty': el => { const b = el.closest('.baris'); const it = M && M.items[+b.dataset.i]; if (!it) return; const v = bulat((+it.qty || 0) + (+el.dataset.d)); if (v <= 0) return; it.qty = v; $('.in-qty', b).value = angka(v); setText('.b-jml', ribu(Math.round(it.qty * it.harga)), b); $('.b-info', b).innerHTML = infoM(it); mTotal(); simpanDrafM(); },
  'm-hapus': el => { const b = el.closest('.baris'); if (!M) return; M.items.splice(+b.dataset.i, 1); mBaris(); simpanDrafM(); },
  'm-metode': el => { if (!M) return; M.metode = el.dataset.m; if (M.metode !== 'Tempo') M.bayar = 0; mBayar(); simpanDrafM(); },
  'm-hapus-foto': el => { if (!M) return; M.foto.splice(+el.dataset.i, 1); mFoto(); },
  'm-simpan': () => simpanMasuk()
});
const renderAsli = render;
render = function () { renderAsli(); perbaruiLencana(); };

mulaiInti('pesanan');

</script>
